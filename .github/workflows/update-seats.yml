name: Update Cal Poly seats (daily)

# Parallel "lanes": each matrix entry is a group of subjects scraped by one
# runner, all at the same time, so a big pull finishes in minutes instead of
# hours. Every lane ONLY writes seat data to Supabase — never commits to the
# repo — so it can't interfere with anyone's app work or pull requests.
on:
  schedule:
    - cron: '0 14 * * *'          # 14:00 UTC = 7:00 AM Pacific
  workflow_dispatch:
    inputs:
      details:
        description: '1 = full seat counts + real times (slower). 0 = discovery/list-only (fast, validates subjects).'
        default: '1'
        type: choice
        options: ['1', '0']

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one bad lane never cancels the others
      max-parallel: 10            # public-repo concurrency headroom is ~20
      matrix:
        lane:
          # Balanced to ~220 sections/lane from measured discovery counts, so every
          # lane finishes in ~13 min and none lags. CSC (233) rides solo.
          - 'CSC'                       # 233
          - 'MATH,SOC'                  # 169+49
          - 'BUS,PSY,ANT'               # 157+49+22
          - 'ME,COMS,GEOG'              # 149+61+19
          - 'KINE,ARCH,ES'              # 130+66+28
          - 'CE,PHIL,HIST'              # 117+69+42
          - 'POLS,ASCI,ECON,GEOL'       # 115+76+23+9
          - 'EE,PHYS,CHEM'              # 107+78+42
          - 'ENGL,STAT,AERO'            # 100+81+42
          - 'BIO,MU,ART'                # 87+86+45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + Chromium
        working-directory: seats
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape lane -> Supabase
        working-directory: seats
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CP_TERM:              ${{ vars.CP_TERM || '2268' }}          # Fall 2026
          CP_SUBJECTS:          ${{ matrix.lane }}
          CP_FETCH_DETAILS:     ${{ github.event.inputs.details || '1' }}
        run: node scrape-seats.mjs

      - name: Upload diagnostics (screenshots + page text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-lane-${{ strategy.job-index }}
          path: |
            seats/diag-*.png
            seats/diag-*.txt
            seats/seats.json
          if-no-files-found: ignore
          retention-days: 7
