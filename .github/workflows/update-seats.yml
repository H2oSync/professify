name: Update Cal Poly seats (daily)

# Parallel "lanes": each matrix entry is a group of subjects scraped by one
# runner, all at the same time, so a big pull finishes in minutes instead of
# hours. Every lane ONLY writes seat data to Supabase — never commits to the
# repo — so it can't interfere with anyone's app work or pull requests.
on:
  schedule:
    - cron: '0 14 * * *'          # 14:00 UTC = 7:00 AM Pacific
  workflow_dispatch:
    inputs:
      details:
        description: '1 = full seat counts + real times (slower). 0 = discovery/list-only (fast, validates subjects).'
        default: '1'
        type: choice
        options: ['1', '0']

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # one bad lane never cancels the others
      max-parallel: 20            # public-repo concurrency headroom is ~20
      matrix:
        lane:
          # FULL Cal Poly subject coverage — all majors, every GE, and all
          # concentration courses (concentrations live inside their subject, so
          # covering the subject covers them). ~84 subjects balanced to ~185
          # sections/lane so every lane still finishes in ~13 min. Any subject
          # with no sections this term simply returns nothing — harmless.
          - 'CSC'
          - 'AERO,CHEM,CRP,GSA,RELS,CPE'
          - 'PSY,AGB,BOT,GER,NR,ENVE'
          - 'PHYS,BIO,FR,MSL,HLTH'
          - 'EE,FPE,MSCI,ANT'
          - 'ASCI,ASTR,ESM,MGT,ECON'
          - 'MATH,GEOG'
          - 'POLS,ISLA,SCM,NUTR'
          - 'ART,ITP,DANC,HNRS,SPAN,FSN'
          - 'KINE,MCRO,CD'
          - 'PHIL,ARCE,EDUC,LAES,ES'
          - 'SOC,IME,CHIN,GSB,PSC,FDSC'
          - 'STAT,BRAE,GRC,PLSC,BMED'
          - 'ARCH,AGED,EDES,LA,WVIT'
          - 'MU,DATA,ITAL,SPED,GEOL'
          - 'ENGL,ERSC,LS,MATE'
          - 'BUS,CM'
          - 'COMS,AGC,DSCI,JPNS,WLC'
          - 'ME,WGQS'
          - 'CE,JOUR,TH'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + Chromium
        working-directory: seats
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape lane -> Supabase
        working-directory: seats
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CP_TERM:              ${{ vars.CP_TERM || '2268' }}          # Fall 2026
          CP_SUBJECTS:          ${{ matrix.lane }}
          CP_FETCH_DETAILS:     ${{ github.event.inputs.details || '1' }}
        run: node scrape-seats.mjs

      - name: Upload diagnostics (screenshots + page text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-lane-${{ strategy.job-index }}
          path: |
            seats/diag-*.png
            seats/diag-*.txt
            seats/seats.json
          if-no-files-found: ignore
          retention-days: 7
