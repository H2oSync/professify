# Not app pages either: the database schema (which spells out every row-level
# security rule to anyone who asks for it), the stale scraper source, and the repo's
# own docs. None of these were ever meant to be served from professify.app.
[[redirects]]
  from = "/supabase-setup.sql"
  to = "/"
  status = 301
