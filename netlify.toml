# Netlify config for Professify.
# The app is a single static index.html — no build step.

[build]
  publish = "."
  command = ""

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Don't hard-cache the HTML so deploys show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# publish = "." serves EVERY file in the repo root, so each old build left lying
# around here has been a live, public copy of Professify at its own URL. Verified
# 2026-08-24: professify.app/index_v7.html returned a working months-old app whose
# own disclaimer reads "Some sample reviews and grade data are placeholders" —
# fabricated data, on the real domain, one guessed URL away, with no robots.txt to
# keep it out of search results.
#
# Redirects are matched before static files, so these stop being reachable
# immediately. The files themselves should still be deleted from the repo; this is
# the lock on the door, not the cleanup.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/index-legacy-v0.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index_6.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index_v7.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/professify-merged-final_2.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/professor-plan_26.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/professor-plan_31.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/sprint.html"
  to = "/"
