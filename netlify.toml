# ---------------------------------------------------------------------------
# The invite link. /invite is a separate FILE (invite.html) rather than a query
# string on the app, because the app is one static index.html: ?add=<id> cannot
# change which <meta> tags get served, so an invite texted to a friend previewed
# with the homepage card and nothing in the app could fix it. invite.html carries
# its own Open Graph tags and hands the person on to /?add=<id>.
#
# status = 200 is a REWRITE, not a redirect: the address bar keeps saying /invite
# and, critically, the query string survives so the token reaches the page.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/invite"
  to = "/invite.html"
  status = 200

# Don't hard-cache the invite page either — it is a preview surface, and a stale
# copy in a CDN edge would keep serving yesterday's card after a change.
[[headers]]
  for = "/invite.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
