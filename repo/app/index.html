input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input:focus-visible{outline:0}
.search:focus-within,.cinput:focus-within{box-shadow:0 0 0 2px var(--blue)}
.composer input:focus{box-shadow:0 0 0 2px var(--pink)}
.ta:focus-visible{outline:0;box-shadow:0 0 0 2px var(--blue)}
img{display:block}
svg{display:block;flex:none}

/* ---------- stage ---------- */
.stage{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;gap:56px;padding:16px}
.side{width:270px;flex:none;display:none}
@media (min-width:1000px){.side{display:block}}
.side .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.side .brand img{width:44px;height:44px;border-radius:13px;box-shadow:0 6px 16px rgba(22,51,107,.18)}
.side .brand b{font-size:24px;font-weight:900;color:var(--navy);letter-spacing:-.01em;display:block;line-height:1.1}
.side .ver{display:inline-block;background:var(--blue-soft);color:var(--blue-ink);font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px;margin-top:3px}
.side p{color:var(--muted);font-weight:700;font-size:14px;line-height:1.5;margin-bottom:18px}
.side h4{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.side ol{list-style:none;counter-reset:t;display:grid;gap:9px;margin-bottom:22px}
.side li{counter-increment:t;display:flex;gap:10px;font-size:14px;font-weight:700;color:var(--ink3);line-height:1.4}
.side li::before{content:counter(t);flex:none;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--blue);font-size:12px;font-weight:900;display:grid;place-items:center;box-shadow:0 1px 3px rgba(22,51,107,.12)}
.side .reset{background:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-size:14px;color:var(--ink3);box-shadow:0 1px 3px rgba(22,51,107,.12)}
.side .reset:hover{color:var(--blue)}

.phone-wrap{width:calc(402px * var(--s,1));height:calc(874px * var(--s,1));flex:none}
.phone{position:relative;width:402px;height:874px;border-radius:58px;background:var(--bg);overflow:hidden;transform:scale(var(--s,1));transform-origin:top left;
  box-shadow:0 0 0 1.5px #C9D2E0,0 0 0 9px #fff,0 0 0 10.5px #D5DCE8,0 40px 90px rgba(22,51,107,.22)}
.status{position:absolute;inset:0 0 auto 0;height:var(--sb);display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 52px;font-weight:900;font-size:17px;z-index:40;pointer-events:none;color:var(--ink)}
.status{background:linear-gradient(var(--bg) 75%,rgba(244,246,251,0))}
.status.dark{color:#fff;background:#0F172A}
.status .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:41}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#0F172A;opacity:.28;z-index:60;pointer-events:none}

#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:var(--sb);scrollbar-width:none;overscroll-behavior:contain}
#scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
#fixtop{position:absolute;left:0;right:0;top:var(--sb);z-index:20}
#fixbot{position:absolute;left:0;right:0;bottom:0;z-index:20}

/* mobile: full bleed */
@media (max-width:520px){
  :root{--sb:max(env(safe-area-inset-top),14px)}
  .stage{padding:0}
  .phone-wrap{width:100vw;height:100dvh}
  .phone{width:100vw;height:100dvh;border-radius:0;transform:none;box-shadow:none}
  .status,.island,.homebar{display:none}
  .tabbar{padding-bottom:max(env(safe-area-inset-bottom),10px)!important}
  .composer input,.ta,.cinput input,.search input{font-size:16px}
  .composer{padding-bottom:max(env(safe-area-inset-bottom),12px)}
  .bottombar{padding-bottom:max(env(safe-area-inset-bottom),16px)}
  .sheet{bottom:max(env(safe-area-inset-bottom),8px)}
  .side{display:none!important}
}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 22px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:#64748B;font-size:12px;font-weight:800}
.tab .pill{width:52px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.tab.on{color:var(--ac)}
.tab.on .pill{background:var(--acs)}

/* ---------- FAB ---------- */
.fab{position:absolute;right:10px;bottom:calc(var(--tb) + 6px);z-index:31;display:flex;flex-direction:column;align-items:center;width:68px}
.fab .bub{background:#fff;border:2px solid var(--navy);color:var(--navy);font-size:11px;font-weight:900;padding:3px 9px;border-radius:13px;position:relative;white-space:nowrap;box-shadow:0 4px 10px rgba(22,51,107,.15)}
.fab .bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:8px;height:8px;background:#fff;border:2px solid var(--navy);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.fab img{width:50px;height:60px;object-fit:contain;margin-top:3px;filter:drop-shadow(0 8px 10px rgba(22,51,107,.28));animation:soar 4.8s ease-in-out infinite}
@keyframes soar{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(-2.5deg)}65%{transform:translateY(-2px) rotate(2deg)}}

/* ---------- sheets / toast ---------- */
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.42);z-index:70;animation:fade .2s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:calc(100% - var(--sb) - 16px);background:#fff;border-radius:30px;z-index:71;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(15,23,42,.18)}
.sheet .sbody{overflow-y:auto;padding:22px 20px 20px;scrollbar-width:none}
.sheet .sbody::-webkit-scrollbar{display:none}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:4px}
.grab{width:40px;height:5px;border-radius:3px;background:#CBD5E1;margin:10px auto 0;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink3);flex:none}
#toast{position:absolute;left:50%;top:calc(var(--sb) + 8px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:11px 16px;border-radius:14px;z-index:90;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:340px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- shared ---------- */
.pad{padding:0 16px}
.title{font-size:34px;font-weight:900;letter-spacing:-.02em;padding:12px 16px 14px;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(22,51,107,.06)}
.sec-h{font-size:19px;font-weight:900;padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec-h a,.link{color:var(--pink);font-size:15px;font-weight:900;cursor:pointer}
.code{display:inline-block;background:var(--blue-soft);color:var(--blue-ink);font-weight:900;font-size:13px;padding:5px 10px;border-radius:9px;letter-spacing:.02em;white-space:nowrap}
.muted{color:var(--muted)}
.b{font-weight:800}
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:900;color:var(--ink2);flex:none;letter-spacing:.01em}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 2px #fff}
.stack .av+.av{margin-left:-8px}
.chev{color:var(--muted2)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 2px rgba(15,23,42,.05),0 6px 16px rgba(22,51,107,.08);color:var(--ink2);position:relative}
.iconbtn.on{color:var(--blue);background:var(--blue-soft)}
.search{margin:0 16px;background:#fff;border-radius:22px;height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px rgba(22,51,107,.05)}
.search input{flex:1;font-size:16px;font-weight:700;height:100%}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;background:#fff;border-radius:24px;padding:4px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px rgba(22,51,107,.05)}
.seg button{flex:1;height:40px;border-radius:20px;font-weight:900;font-size:15px;color:var(--muted);text-align:center;transition:.15s}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.seg.purple button.on{background:var(--purple);box-shadow:0 4px 12px rgba(124,58,237,.3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:#fff;font-weight:800;font-size:14px;color:var(--ink3);white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.chip.on{background:var(--pink);color:#fff}
.chip .n{background:var(--pink-soft);color:var(--pink-ink);border-radius:10px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px;padding:0 5px}
.btn{height:52px;border-radius:18px;background:var(--blue);color:#fff;font-weight:900;font-size:17px;width:100%;text-align:center;box-shadow:0 8px 20px rgba(37,99,235,.28);transition:.15s}
.btn:disabled{background:#CBD5E1;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:none;color:var(--blue);box-shadow:none}
.btn.soft{background:var(--bg);color:var(--ink2);box-shadow:none}
.pbtn{display:inline-grid;place-items:center;height:36px;padding:0 18px;border-radius:18px;background:var(--blue);color:#fff;font-weight:900;font-size:14px;flex:none;text-align:center}
.pbtn.pink{background:var(--pink)}
.pbtn.done{background:var(--bg);color:var(--muted)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.empty{text-align:center;padding:36px 24px;color:var(--muted);font-weight:700;font-size:15px}
.empty b{display:block;color:var(--ink2);font-size:17px;margin-bottom:4px}
.topbtns{display:flex;justify-content:space-between;padding:10px 16px 14px}
.spacer{height:120px}
.star{color:#F59E0B}
.list .li{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%}
.list .li+.li{border-top:1px solid var(--line)}

/* ---------- grid ---------- */
.grid{padding:4px 14px 0}
.g-head,.g-body{display:grid;grid-template-columns:30px repeat(5,1fr);gap:6px}
.g-day{font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0 10px;position:relative}
.g-day.on{color:var(--ink)}
.g-day.on::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;border-radius:2px;background:var(--blue);transform:translateX(-50%)}
.g-body{position:relative}
.g-lab{position:relative}
.g-lab span{position:absolute;right:2px;font-size:10px;font-weight:800;color:var(--muted2);transform:translateY(-50%)}
.g-lab span:first-child{transform:none}
.g-lab span:last-child{transform:translateY(-100%)}
.g-col{position:relative;border-radius:12px;background:var(--bg)}
.g-col.on{background:var(--blue-soft)}
.g-b{position:absolute;left:3px;right:3px;border-radius:8px;background:var(--blue-soft2);color:var(--blue-ink);font-size:10px;font-weight:900;line-height:1.08;display:grid;place-items:center;text-align:center;overflow:hidden;letter-spacing:.02em;transition:transform .12s}
.g-b:hover{transform:scale(1.04)}
.g-b.sel{background:var(--blue);color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.3)}
.g-b.shared{box-shadow:0 0 0 2.5px var(--yellow),0 4px 10px rgba(250,204,21,.25)}
.g-b.one{font-size:9.5px;white-space:nowrap}

/* ---------- home ---------- */
.homehdr{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.homehdr .logo{width:44px;height:44px;border-radius:14px;box-shadow:0 6px 16px rgba(22,51,107,.18)}
.dot{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px #fff}
.me-btn{width:44px;height:44px;border-radius:50%;background:#FDBA74;font-weight:900;font-size:15px;display:grid;place-items:center;color:var(--ink2)}
.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none}
.story .ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 3.5px var(--rc,transparent);transition:transform .15s}
.story .ring span{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;color:rgba(15,23,42,.55)}
.story .nm{font-size:13px;font-weight:900;color:var(--ink2);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story.on .ring{transform:scale(1.06)}
.story.on .nm{color:var(--blue)}
.fcard{margin:6px 16px 0;padding:16px 0 14px}
.fcard .top{display:flex;align-items:center;gap:12px;padding:0 16px 10px;width:100%}
.pillchip{display:inline-block;background:var(--blue-soft);color:var(--blue-ink);font-weight:900;font-size:13px;padding:4px 10px;border-radius:14px;margin-top:3px}
.foot{padding:12px 18px 0;color:var(--muted);font-weight:800;font-size:14px}
.mightknow{margin:16px 16px 0;border:2px dashed #F9A8D4;border-radius:24px;padding:14px 16px;background:#fff}
.mk-t{color:#BE185D;font-weight:900;font-size:13px;margin-bottom:10px}
.where .li{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%}
.where .li+.li{border-top:1px solid var(--line)}

/* ---------- explore ---------- */
.frow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 12px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:var(--blue-soft);color:var(--blue-ink);font-weight:900;font-size:15px}
.fchip .n{background:var(--blue);color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.ccard{display:block;width:100%;padding:16px 16px 14px;margin-bottom:12px;border:2px solid transparent;transition:border-color .15s,transform .15s}
.ccard:hover{border-color:#BFD3FF}
.ccard:active{transform:scale(.99)}
.ctitle{font-size:18px;font-weight:900;margin:10px 0 12px;letter-spacing:.005em}
.seat{font-size:13px;font-weight:900;padding:5px 10px;border-radius:12px;white-space:nowrap}
.pcard{display:block;width:100%;padding:14px 16px;margin-bottom:12px;border:2px solid transparent;transition:border-color .15s}
.pcard:hover{border-color:#DDD6FE}
.rchip{display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:var(--amber-ink);font-weight:900;font-size:13px;padding:4px 9px;border-radius:10px}

/* ---------- detail heroes ---------- */
.hero{margin:0 16px;border-radius:28px;padding:20px 18px 18px;color:#fff;box-shadow:0 14px 30px rgba(37,99,235,.25)}
.hero.blue{background:var(--blue)}
.hero.purple{background:var(--purple);box-shadow:0 14px 30px rgba(124,58,237,.25)}
.hero h1{font-size:27px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.hero p{font-weight:700;font-size:15px;opacity:.95;line-height:1.45;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 10px}
.stat small{display:block;font-size:10.5px;font-weight:900;letter-spacing:.09em;opacity:.85}
.stat b{font-size:16px;font-weight:900}
.hchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:900;padding:5px 10px;border-radius:10px}
.profrow{display:flex;align-items:center;gap:12px;background:#F6F2FF;border-radius:18px;padding:10px 12px;width:100%}
.profrow .nm{color:var(--purple-ink);font-weight:900;font-size:17px}
.secrow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:10px 10px 10px 14px;margin-top:8px}
.secrow .t{flex:1;font-size:15px;color:var(--ink3);font-weight:600}
.secrow .t b{color:var(--ink);font-weight:900}
.addbtn{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(37,99,235,.3);transition:.15s}
.addbtn.in{background:var(--teal);box-shadow:0 4px 10px rgba(15,118,110,.3)}
.wl{height:36px;padding:0 12px;border-radius:18px;background:#fff;border:1.5px solid #E2E8F0;font-weight:900;font-size:13px;color:var(--ink3)}
.wl.in{background:var(--amber-soft);border-color:#FCD34D;color:var(--amber-ink)}
.planpick{display:flex;gap:6px}
.planpick button{height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:900;background:#fff;color:var(--muted);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.planpick button.on{background:var(--blue);color:#fff}
.bars{display:grid;gap:8px;flex:1}
.bar{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:900;color:var(--ink3)}
.bar i{flex:1;height:7px;border-radius:4px;background:#EEF2F8;position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;border-radius:4px}
.tag{display:inline-block;background:var(--purple-soft);color:var(--purple-ink);font-weight:900;font-size:13px;padding:7px 12px;border-radius:16px;margin:0 6px 6px 0}
.teach{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:10px 12px;width:100%;margin-top:8px}
.know{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.know div{background:var(--bg);border-radius:14px;padding:10px 12px}
.know small,.kv small{display:block;font-size:10.5px;font-weight:900;letter-spacing:.09em;color:var(--muted2)}
.know b,.kv b{font-size:15px;font-weight:900}
.review{padding:14px 0}
.review+.review{border-top:1px solid var(--line)}
.review p{font-size:14.5px;font-weight:600;color:var(--ink3);line-height:1.45;margin-top:6px}
.mine{background:var(--blue-soft);color:var(--blue-ink);font-size:11px;font-weight:900;padding:2px 7px;border-radius:8px}

/* ---------- rate ---------- */
.term{display:flex;align-items:center;gap:10px;padding:18px 20px 10px;font-size:17px;font-weight:900}
.curterm{background:var(--amber-soft);color:#B45309;font-size:13px;font-weight:900;padding:4px 10px;border-radius:12px}
.rscore{display:flex;align-items:center;gap:4px;color:var(--amber-ink);font-weight:900;font-size:16px}
.rf{min-height:100%;background:linear-gradient(#0F172A,#1E293B) top/100% 140px no-repeat}
.rf-sheet{background:var(--bg);border-radius:28px 28px 0 0;margin-top:52px;min-height:calc(100% - 52px);padding:10px 16px 140px;position:relative}
.rf-head{display:flex;align-items:center;gap:12px;padding:16px 2px 16px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--blue)}
.fcardx{background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px rgba(22,51,107,.05);overflow:hidden}
.frow2{padding:16px 16px;border-top:1px solid var(--line)}
.frow2:first-child{border-top:0}
.flabel{font-weight:900;font-size:15px}
.stars{display:flex;gap:6px}
.stars button{width:32px;height:32px;display:grid;place-items:center;transition:transform .12s}
.stars button:hover{transform:scale(1.15)}
.sg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:2px}
.sg button{flex:1;height:36px;border-radius:11px;font-weight:900;font-size:15px;color:var(--muted);text-align:center;transition:.12s}
.sg button.on{background:#fff;color:var(--blue-ink);box-shadow:0 1px 4px rgba(15,23,42,.14)}
.hint{font-size:12.5px;font-weight:800;color:var(--muted2)}
.ta{width:100%;min-height:92px;background:var(--bg);border-radius:14px;padding:12px;font-size:15px;font-weight:600;resize:none;margin-top:8px;line-height:1.4}
.bottombar{padding:12px 16px 30px;background:linear-gradient(rgba(244,246,251,0),var(--bg) 30%)}
.okcircle{width:64px;height:64px;border-radius:50%;background:#DCFCE7;color:var(--green);display:grid;place-items:center;margin:20px auto 16px}
.kv{background:var(--bg);border-radius:14px;padding:9px 10px}
.toggle{width:56px;height:34px;border-radius:17px;background:var(--blue);display:flex;align-items:center;padding:3px;flex:none;transition:.2s}
.toggle i{width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.off{background:#CBD5E1}
.toggle.on i{transform:translateX(22px)}

/* ---------- schedule ---------- */
.stabs{display:flex;gap:28px;margin:0 16px;border-bottom:1.5px solid #E2E8F0}
.stabs button{font-size:16px;font-weight:900;color:var(--muted);padding:6px 0 10px;position:relative}
.stabs button.on{color:var(--teal)}
.stabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:3px;border-radius:2px;background:var(--teal)}
.agenda{margin:12px 16px 0;padding:14px 16px 6px}
.agenda h4{font-size:17px;font-weight:900;display:flex;gap:8px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.today{background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:900;padding:2px 8px;border-radius:10px}
.arow{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%}
.arow+.arow{border-top:1px solid var(--line)}
.arow .tm{width:52px;flex:none;font-weight:900;font-size:15px;line-height:1.25}
.arow .tm small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.arow .vb{width:4px;align-self:stretch;border-radius:2px;background:#BFD3FF;flex:none}
.arow.now .vb{background:var(--blue)}
.nowtag{font-size:11px;font-weight:900;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:8px;margin-left:6px}
.anytime{margin:12px 16px 0;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.regbar{display:flex;align-items:center;justify-content:space-between;margin:10px 18px 0;font-size:13.5px;font-weight:800;color:var(--muted)}
.regbadge{display:inline-flex;align-items:center;gap:5px;color:var(--teal);background:var(--teal-soft);font-weight:900;font-size:12.5px;padding:4px 10px;border-radius:12px}
.progress{height:10px;border-radius:5px;background:#E2E8F0;overflow:hidden;margin:10px 0 6px}
.progress u{display:block;height:100%;background:var(--teal);border-radius:5px}
.st{font-size:12px;font-weight:900;padding:4px 9px;border-radius:10px;white-space:nowrap}

/* ---------- friends / chat ---------- */
.fhdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 14px}
.fhdr .title{padding:0}
.plusbtn{width:46px;height:46px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(219,39,119,.35)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.thread{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.thread+.thread{border-top:1px solid var(--line)}
.thread .nm{font-weight:900;font-size:16px}
.thread .pv{font-size:14.5px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .pv.read{color:var(--muted);font-weight:600}
.thread .tm{font-size:13px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.udot{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.ringav{border-radius:50%;padding:3px;box-shadow:inset 0 0 0 2.5px var(--rc,transparent);flex:none}
.sq{border-radius:16px;display:grid;place-items:center;font-weight:900;flex:none}
.pym{width:150px;flex:none;padding:18px 12px 14px;text-align:center;scroll-snap-align:start}
.pym .nm{font-weight:900;font-size:15px;margin-top:10px}
.pym .sub{font-size:12.5px;font-weight:700;color:var(--muted);margin:3px 0 12px;min-height:32px}
.pym .pbtn{width:100%}
.chathdr{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;background:rgba(244,246,251,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.msgs{padding:14px 14px 20px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;font-weight:600;line-height:1.35;background:#fff;align-self:flex-start;box-shadow:0 1px 2px rgba(15,23,42,.06);word-wrap:break-word}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end}
.msg .who{display:block;font-size:11.5px;font-weight:900;color:var(--pink);margin-bottom:1px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted2);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px 30px;background:rgba(244,246,251,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.composer input{flex:1;height:46px;background:#fff;border-radius:23px;padding:0 18px;font-size:15.5px;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.sendbtn{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.sendbtn.pink{background:var(--pink)}

/* ---------- champ ---------- */
.champ-hero{position:relative;height:120px}
.champ-hero img{position:absolute;left:50%;bottom:-6px;width:170px;height:206px;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 14px 18px rgba(22,51,107,.28));animation:soar 4.8s ease-in-out infinite}
.champ.sheet{overflow:visible}
.champ .ctitle2{font-size:30px;font-weight:900;color:var(--navy);text-align:center;letter-spacing:-.01em}
.cchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cchip{flex:none;white-space:nowrap;height:38px;padding:0 15px;border-radius:19px;font-weight:900;font-size:14px}
.cc1{background:var(--purple-soft);color:var(--purple-ink)}
.cc2{background:var(--pink-soft);color:var(--pink-ink)}
.cc3{background:var(--teal-soft);color:var(--teal)}
.cc4{background:var(--blue-soft);color:var(--blue-ink)}
.cinput{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:28px;padding:6px 6px 6px 18px}
.cinput input{flex:1;height:44px;font-size:16px;font-weight:700}
.cinput input::placeholder{color:var(--muted)}
.bot{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:92%}
.bot img{width:30px;height:36px;object-fit:contain;flex:none}
.bot .msg{max-width:none;background:var(--bg);box-shadow:none}
.bot .msg b{font-weight:900}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{height:32px;padding:0 12px;border-radius:16px;background:#fff;color:var(--blue-ink);font-weight:900;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.1)}
.act.primary{background:var(--blue);color:#fff}

/* ---------- TermChamp wiring: states the prototype never had ---------- */
.tc-signin{min-height:100%;display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding:calc(var(--sb) + 24px) 24px 40px;text-align:center}
.tc-signin .tc-logo{width:84px;height:84px;margin:0 auto 10px;border-radius:22px}
.tc-signin .tc-champ{width:120px;height:140px;object-fit:contain;margin:0 auto 6px}
.tc-signin h1{font-size:26px;font-weight:1000;line-height:1.15;color:var(--navy);text-wrap:balance;margin:6px 0 8px}
.tc-signin p{color:var(--muted);font-weight:700;font-size:15.5px;line-height:1.45;margin:0 auto 20px;max-width:32ch}
.tc-signin .btn{display:grid;place-items:center}
.tc-form{display:grid;gap:12px;text-align:left;margin-bottom:8px}
.tc-form label{display:grid;gap:6px;font-weight:900;font-size:14px;color:var(--ink3)}
.tc-form input{height:50px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font:inherit;font-size:16px;font-weight:700;color:var(--ink)}
.tc-form input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.tc-err{background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;line-height:1.4;text-align:left;margin:6px 0}
.tc-fine{font-size:13.5px!important;margin-top:18px!important}
a.btn.tc-a{display:grid;place-items:center;text-decoration:none}
.tc-desc{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sg.tc-wrap{flex-wrap:wrap;gap:4px}
.sg.tc-wrap button{flex:1 0 auto;min-width:52px;padding:0 10px}
.tc-spin{display:block;width:22px;height:22px;margin:12px auto 0;border-radius:50%;border:3px solid var(--blue-soft2);border-top-color:var(--blue);animation:tcspin .8s linear infinite}
.tc-spin.big{width:34px;height:34px;margin-top:24px}
@keyframes tcspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tc-spin{animation-duration:2.4s}}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.side a{color:inherit}

</style>
</head>

window.TERMCHAMP_APP_BUILD = '2026-09-28 01:00';
/* ================================================================================================
   TERMCHAMP — THE PHONE APP (termchamp.com/app)
   ------------------------------------------------------------------------------------------------
   App 2.0's design (Tate's, 2026-09) with TermChamp's real backend underneath. One file, like the
   desktop index.html: edit it, upload it to app/index.html, and Netlify publishes it at /app/.
   Order in this script: the designer's images and small helpers, then THE BACKEND (every read
   and write), then THE SCREENS, then Champ, actions and rendering.

/* A meeting string from the seat feed or an import: "MoWe 4:10PM - 6:00PM", also "MWF 9:10 AM-10:00 AM".
   Returns {days:'MW', s, e} in the letters the screens use (R = Thursday), or null when there is no
   usable day AND time. Ported from the desktop's parseMeet, which learned these shapes the hard way. */
function parseMeet(str) {
  if (!str) return null; str = String(str).trim();
  if (/tba/i.test(str)) return null;
  str = str.replace(/^\s*([MTWRFU]{2,6})(?=[\s,]|$)/, tok => tok.toUpperCase().split('').map(ch => ({ M: 'Mo', T: 'Tu', W: 'We', R: 'Th', F: 'Fr', U: 'Su' }[ch] || '')).join(''));
  const dm = str.match(/^((?:Mo|Tu|We|Th|Fr|Sa|Su)+)/); if (!dm) return null;
  const two = dm[1].match(/Mo|Tu|We|Th|Fr|Sa|Su/g) || [];
  const tm = str.match(/(\d{1,2}):(\d{2})\s*([AaPp][Mm])\s*[–—-]\s*(\d{1,2}):(\d{2})\s*([AaPp][Mm])/);
  if (!tm || !two.length) return null;
  const to24 = (h, mi, ap) => { h = +h; mi = +mi; ap = ap.toUpperCase(); if (ap === 'PM' && h !== 12) h += 12; if (ap === 'AM' && h === 12) h = 0; return h * 60 + mi; };
  const s = to24(tm[1], tm[2], tm[3]), e = to24(tm[4], tm[5], tm[6]);
  if (e <= s) return null;
  const L = { Mo: 'M', Tu: 'T', We: 'W', Th: 'R', Fr: 'F', Sa: 'S', Su: 'U' };
  return { days: two.map(d => L[d]).join(''), s, e };
}
/* Section status, ported from the desktop's seatStatusOf: a status we do not recognise and no
   seats is "unknown", never "full". */
function seatStatusOf(raw, available) {
  const t = String(raw == null ? '' : raw).trim().toLowerCase().replace(/[\s_-]+/g, '');
  if (t === 'waitlist' || t === 'waitlisted' || t === 'wl') return 'wait';
  if (t === 'closed' || t === 'full' || t === 'cancelled' || t === 'canceled') return 'full';
  if (t === 'open' || t === 'available') return 'open';
  return available > 0 ? 'open' : 'unknown';
}
/* "Examplewood, Ada" or "Ada Examplewood" → one key per person. Staff/TBA → '' (no professor). */
function profKeyOf(instructor) {
  let n = String(instructor || '').trim();
  if (!n || /^(staff|tba|tbd|to be announced)$/i.test(n)) return '';
  n = n.split(/\s*[;\/]\s*|\s+and\s+/i)[0];                  // co-taught: the first named
  if (n.indexOf(',') >= 0) { const [l, f] = n.split(','); n = (f || '').trim().split(/\s+/)[0] + ' ' + (l || '').trim(); }
  const w = n.toLowerCase().replace(/[.]/g, '').split(/\s+/).filter(Boolean);
  if (!w.length) return '';
  return w.length > 1 ? w[0] + ' ' + w[w.length - 1] : w[0];
}

      location: r.location || '', rawDays: r.days || '', instructor: (r.instructor || '').trim() });

async function loadSeats() {

/* The scraper stored the class-search page around some descriptions (seat tables, notes): keep only

function cleanDesc(t) {

  const CH = /Enrl Tot|Wait Tot|Class Notes|Selected Topic Courses|https?:\/\//;
  if (CH.test(t)) {
    const re = /Enrl Tot|Wait Tot|Class Notes|Selected Topic Courses webpage:?|https?:\/\/\S+|(Open|Closed|Wait List) \d+ \d+/g; let m, end = 0;
    while ((m = re.exec(t))) end = m.index + m[0].length;
    const lab = /\bDescription\s+(?=[A-Z])/g; lab.lastIndex = end; const l = lab.exec(t);
    if (!l) return null; t = t.slice(l.index + l[0].length);

    if (!res.ok) { TC.err.poly = true; return; }
    const j = await res.json();

    if (list && !Array.isArray(list) && Array.isArray(list.json)) list = list.json;
    if (!Array.isArray(list) || !list.length) { TC.err.poly = true; return; }

const planTimers = {};

   only if the plan was what watched it — a section watched on its own stays watched. */
function inAnyPlan(id) { return ['A', 'B', 'C'].some(k => TC.plans[k].indexOf(String(id)) >= 0); }

/* What TermChamp reviewers said about one professor, and ONLY that — each figure carries the

const STAT_MIN = 3;
function tcReviewsFor(pk) {

function reviewStats(pk) {

  return {

    diff: diffN.length >= STAT_MIN ? Math.round(10 * diffN.reduce((a, v) => a + v.difficulty, 0) / diffN.length) / 10 : null, diffN: diffN.length,
    dist, tags: Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]).slice(0, 5)

/* ---- word filter, lifted verbatim from index.html by build.py ---- */
var WF_WORDS=[
  'nigger','nigga','chink','gook','spic','wetback','beaner','kike',
  'wop','towelhead','raghead','sandnigger','coon','jigaboo','abo','gyppo',
  'pikey','faggot','fag','fagot','tranny','shemale','ladyboy','retard',
  'retarded','tard','spastic','mongoloid','cripple','fuck','fucker','fucking',
  'motherfucker','clusterfuck','shit','bullshit','shithead','shitty','cunt','twat',
  'bitch','bastard','whore','slut','skank','dick','cock','prick',
  'wanker','wank','jackoff','jerkoff','asshole','arsehole','dumbass','jackass',
  'asshat','pussy','tits','titty','boobs','blowjob','handjob','rimjob',
  'cum','jizz','dildo','buttplug','felch','queef','pedo','pedophile',
  'rapist','molester','professify','calpoly','mustangs'];
/* substring-safe subset — usernames only */
function wfLeet(t){
  return String(t==null?'':t).toLowerCase().replace(/[0134578@$!|]/g,function(c){
    return {'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','@':'a','$':'s','!':'i','|':'l'}[c];
  });
}
function wfNorm(t){ return wfLeet(t).replace(/([a-z])[._*-]+(?=[a-z])/g,'$1'); }
function wfSplit(t){ return wfLeet(t).replace(/[._*-]/g,' '); }
/* every letter may repeat, so 'ass' -> a+s+s+ and 'fuuuuck' is caught */
function wfPat(w){ return w.replace(/(.)/g,'$1+'); }
/* [^a-z] and not \b: JS counts digits and underscores as word characters, so \bfuck\b misses
   'fuck2' and 'fuck_face' — the first two shapes anybody reaches for. */
function wfHit(t){
  if(!t)return null;
  var a=wfNorm(t), b=wfSplit(t);
  for(var i=0;i<WF_WORDS.length;i++){
    var re=new RegExp('(^|[^a-z])'+wfPat(WF_WORDS[i])+'([^a-z]|$)');
    if(re.test(a)||re.test(b))return WF_WORDS[i];
  }
  return null;
}

TC.postReview = async function (pk, d) {
  const P = PROFS[pk]; if (!P) return { err: 'Unknown professor' };
  if (iReviewed(pk)) return { err: 'You’ve already reviewed ' + P.name + '. One review per professor keeps the average honest — edit yours on termchamp.com.' };
  const words = String(d.review || '').trim().split(/\s+/).filter(Boolean).length;
  if (words > 300) return { err: 'That’s ' + words + ' words — the limit is 300. Trim ' + (words - 300) + ' and post again; nothing you wrote has been deleted.' };
  const bad = wfHit(d.review || '');
  if (bad) return { err: 'Reviews are public, so “' + bad + '” can’t go in one. Say it about the teaching and post again — nothing you wrote has been deleted.' };
  /* The same hourly cap as the desktop, counted in the same place on this device. The real
     limit is the database's INSERT policy; this only says so before the student is refused. */
  const now = Date.now(); let hits = [];
  try { hits = JSON.parse(localStorage.getItem('professify_rev_times') || '[]'); } catch (e) {}
  hits = (Array.isArray(hits) ? hits : []).filter(t => now - t < 3600000);
  if (hits.length >= 30) return { err: 'That’s 30 reviews in an hour — the limit. Try again a little later.' };
  const row = { professor_key: reviewKeyOf(pk), professor_name: P.name, department: P.dept || null, course: d.code || null, score: d.stars,
    difficulty: d.diff || null, teach_ability: null, hours: null, format: d.format || null, grade: d.grade || null,
    would_again: d.again === 'yes', tags: [], note: (d.review || '').trim() || null };
  let r = await TC.client().from('reviews').insert(row);
  if (r.error && /grade/i.test(r.error.message || '') && schemaGap(r.error)) { const x = Object.assign({}, row); delete x.grade; r = await TC.client().from('reviews').insert(x); }
  if (r.error) {
    const msg = String(r.error.message || '');
    /* The database's own refusals (see professify-review-refusals.sql) are written for students;
       anything else is a raw error, which is not. */
    if (/duplicate|unique/i.test(msg)) return { err: 'You’ve already reviewed ' + P.name + '. One per professor keeps the average honest.' };
    if (r.error.code === 'P0001' && msg && msg.length < 240) return { err: msg };
    if (/row-level security|policy/i.test(msg)) return { err: 'That’s the limit on reviews for now — try again later. Nothing you wrote has been lost.' };
    return { err: 'Couldn’t post your review — check your connection and try again. Nothing you wrote has been lost.' };
  }
  hits.push(now); try { localStorage.setItem('professify_rev_times', JSON.stringify(hits)); } catch (e) {}
  /* Read our own rows back through my_reviews() — the only way this account can see its own
     review ids — so the "show friends" switch has a row to change. */
  const at = new Date().toISOString();
  let id = null;
  try {

async function loadThreads() {
  const sb = TC.client(), me = TC.user.id;
  const mine = await sb.from('conversation_members').select('conversation_id,last_read_at').eq('user_id', me);
  if (mine.error) { TC.err.threads = mine.error.message; return; }
  const ids = (mine.data || []).map(r => r.conversation_id);
  const readAt = Object.fromEntries((mine.data || []).map(r => [r.conversation_id, r.last_read_at]));
  if (!ids.length) { TC.threads = []; return; }
  const [convs, memb, last] = await Promise.all([
    sb.from('conversations').select('id,kind,title,created_by,last_at').in('id', ids),
    sb.from('conversation_members').select('conversation_id,user_id').in('conversation_id', ids),
    sb.from('messages').select('conversation_id,sender,kind,body,created_at').in('conversation_id', ids).order('created_at', { ascending: false }).limit(300)
  ]);
  if (convs.error) { TC.err.threads = convs.error.message; return; }
  const members = {}; ((memb && memb.data) || []).forEach(r => { (members[r.conversation_id] = members[r.conversation_id] || []).push(r.user_id); });
  const lastOf = {}, spoke = {};
  ((last && last.data) || []).forEach(m => { if (!lastOf[m.conversation_id]) lastOf[m.conversation_id] = m; if (m.sender !== me) (spoke[m.conversation_id] = spoke[m.conversation_id] || {})[m.sender] = 1; });
  TC.threads = (convs.data || []).map(c => ({ id: c.id, kind: c.kind, title: c.title, last_at: c.last_at, members: members[c.id] || [], last: lastOf[c.id] || null,
    last_read_at: readAt[c.id], senders: Object.keys(spoke[c.id] || {}) })).sort((a, b) => new Date(b.last_at) - new Date(a.last_at));
  const unknown = [...new Set(TC.threads.flatMap(t => t.members.concat(t.senders)))].filter(u => u !== me && !TC.names[u]);
  if (unknown.length) { const p = await sb.from('profiles').select('id,display_name,username,avatar_url').in('id', unknown); (p.data || []).forEach(x => { TC.names[x.id] = { name: x.display_name || x.username || 'Someone', avatar: x.avatar_url || '' }; }); }
  delete TC.err.threads;
}
function threadOther(t) { const me = TC.user.id; return t.members.find(u => u !== me) || t.senders.find(u => u !== me) || null; }
function nameOf(uid) { if (uid === (TC.user && TC.user.id)) return 'You'; return (PEOPLE[uid] && PEOPLE[uid].name) || (TC.names[uid] && TC.names[uid].name) || 'Someone'; }
function isUnread(t) { return !!(t.last && t.last.sender !== TC.user.id && (!t.last_read_at || new Date(t.last.created_at) > new Date(t.last_read_at))); }
TC.openThread = async function (cid) {
  const r = await TC.client().from('messages').select('*').eq('conversation_id', cid).order('created_at', { ascending: true }).limit(400);
  /* A failed read keeps what was already on screen (the desktop's rule): an empty thread after a
     network blip reads as "your messages are gone". */
  TC.rowsErr = TC.rowsErr || {};
  if (r.error) { TC.rowsErr[cid] = true; if (TC.rows[cid]) toast('Couldn’t load new messages'); render(true); return; }
  delete TC.rowsErr[cid];
  TC.rows[cid] = r.data || [];
  const at = new Date().toISOString();
  TC.client().from('conversation_members').update({ last_read_at: at }).eq('conversation_id', cid).eq('user_id', TC.user.id).then(() => {});
  const t = TC.threads.find(x => x.id === cid); if (t) t.last_read_at = at;

TC.send = async function (cid, body) {
  const r = await TC.client().from('messages').insert({ conversation_id: cid, sender: TC.user.id, kind: 'text', body, payload: null }).select().single();
  if (r.error) { toast('Couldn’t send — try again'); return false; }
  (TC.rows[cid] = TC.rows[cid] || []).push(r.data);
  const t = TC.threads.find(x => x.id === cid); if (t) { t.last = r.data; t.last_at = r.data.created_at; }
  TC.threads.sort((a, b) => new Date(b.last_at) - new Date(a.last_at));

};
/* One direct thread per pair: find it before making one. */
TC.threadWith = async function (uid) {
  const hit = TC.threads.find(t => t.kind === 'direct' && t.members.length === 2 && t.members.indexOf(uid) >= 0);
  if (hit) return hit.id;
  const sb = TC.client();
  const c = await sb.from('conversations').insert({ kind: 'direct', created_by: TC.user.id }).select().single();
  if (c.error) { toast('Couldn’t start the chat'); return null; }
  const m = await sb.from('conversation_members').insert([{ conversation_id: c.data.id, user_id: TC.user.id }, { conversation_id: c.data.id, user_id: uid }]);
  if (m.error) { toast('Couldn’t start the chat'); return null; }
  await loadThreads();

};
function startRealtime() {
  try {
    const sb = TC.client(); if (!sb || TC.rt) return;
    TC.rt = sb.channel('termchamp-app-messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const m = payload.new; if (!m) return;
      const t = TC.threads.find(x => x.id === m.conversation_id);
      if (!t) { loadThreads().then(() => render(true)); return; }
      if (TC.rows[m.conversation_id] && !TC.rows[m.conversation_id].some(x => x.id === m.id)) TC.rows[m.conversation_id].push(m);
      t.last = m; t.last_at = m.created_at;
      if (cur().s === 'chat' && cur().p && cur().p.id === m.conversation_id) { t.last_read_at = new Date().toISOString(); }
      TC.threads.sort((a, b) => new Date(b.last_at) - new Date(a.last_at));
      render(true); if (cur().s === 'chat') scrollEnd();
    }).subscribe();
  } catch (e) {}
}

/* ---- Champ = Hawk. The same `ask` function the desktop uses; the model only names ONE tool, and
   this app answers it from the data above. Signed out or offline, Champ says so. -------------- */
async function evWho() {
  if (TC._who) return TC._who;
  let v = null; try { v = localStorage.getItem('professify_ev_salt'); } catch (e) {}
  if (!v) { try { const a = new Uint8Array(16); crypto.getRandomValues(a); v = Array.from(a).map(x => x.toString(16).padStart(2, '0')).join(''); localStorage.setItem('professify_ev_salt', v); } catch (e) { v = String(Math.random()).slice(2); } }
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v + '|v2')); TC._who = Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 16); }
  catch (e) { TC._who = ''; }
  return TC._who;
}
TC.ask = async function (q) {
  const sb = TC.client(); if (!sb || !TC.user) return null;
  let tok = null; try { const s = await sb.auth.getSession(); tok = s.data.session && s.data.session.access_token; } catch (e) {}
  if (!tok) return null;
  const who = await evWho();
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) {} }, 9000);
  try {
    const nolog = navigator.globalPrivacyControl === true;
    const res = await fetch(CFG.SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/ask', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tok },
      body: JSON.stringify(Object.assign({ q, term: CFG.TERM, who }, nolog ? { nolog: true } : {})), signal: ctl ? ctl.signal : undefined });
    const j = await res.json(); clearTimeout(timer);
    return j && j.tool ? j : null;
  } catch (e) { clearTimeout(timer); return null; }
};

/* The real clock (the prototype's was fixed at Tuesday 9:41). */
/* In San Luis Obispo's time, not the phone's: classes meet in Pacific time wherever the student
   (or their phone's clock setting) happens to be. */
function slo() {
  try {
    const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    return { wd: p.weekday, min: (+p.hour % 24) * 60 + (+p.minute) };
  } catch (e) { const d = new Date(); return { wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()], min: d.getHours() * 60 + d.getMinutes() }; }
}
const CLOCK = {
  get day() { return { Sun: 'U', Mon: 'M', Tue: 'T', Wed: 'W', Thu: 'R', Fri: 'F', Sat: 'S' }[slo().wd] || 'M'; },
  get min() { return slo().min; }
};
function nowLabel() { return slo().wd + ' ' + hs(CLOCK.min); }

/* Seats. A section's seat count is shown only when the feed gave one. */
function secSeatText(s) {
  if (s.status === 'full') return `<span style="color:var(--pink-ink);font-weight:900">Full</span>`;
  if (s.status === 'wait') return `<span style="color:var(--pink-ink);font-weight:900">Waitlist${s.wl ? ' · ' + s.wl : ''}</span>`;
  if (s.status === 'open' && typeof s.seats === 'number') return `<span style="color:${s.seats <= 5 ? '#B45309' : 'var(--teal)'};font-weight:900">${s.seats} seat${s.seats === 1 ? '' : 's'}</span>`;
  if (s.status === 'open') return `<span style="color:var(--teal);font-weight:900">Open</span>`;
  return `<span class="muted b">Seats unknown</span>`;
}
function courseSeats(code) {

  ss.forEach(s => { if (s.status === 'open') { anyOpen = true; if (typeof s.seats === 'number') open += s.seats; } if (s.status !== 'unknown') known++; });
  return { open, anyOpen, allFull: ss.length > 0 && known === ss.length && !anyOpen, unknown: known === 0 };
}

  if (c.anyOpen) return `<span class="seat" style="background:var(--teal-soft);color:var(--teal)">Open</span>`;

/* ================= grid ================= */
function grid(secs, o) {
  const H = o.H || 320, S0 = 360, S1 = 1320, k = H / (S1 - S0);
  const head = `<div class="g-head"><span></span>${DAYS.map(d => `<button class="g-day ${d === o.sel ? 'on' : ''}" data-a="${o.act}" data-x="${d}">${DAYN[d].toUpperCase()}</button>`).join('')}</div>`;
  const labels = [[360, '6a'], [600, '10a'], [840, '2p'], [1080, '6p'], [1320, '10p']].map(([m, l]) => `<span style="top:${(m - S0) * k}px">${l}</span>`).join('');
  const cols = DAYS.map(d => {
    const blocks = secs.filter(s => !s.async && s.s != null && s.days.includes(d)).map(s => {
      const top = Math.max(0, (s.s - S0) * k), h = Math.max((s.e - s.s) * k, o.one ? 30 : 20);
      const two = h >= 28;
      const cls = ['g-b', d === o.sel ? 'sel' : '', o.shared && o.shared.has(s.code) ? 'shared' : '', two ? '' : 'one'].join(' ');
      const [subj, num] = s.code.split(' ');
      return `<button class="${cls}" style="top:${top}px;height:${h}px" data-a="${o.blockAct || 'openClass'}" data-x="${s.code}" data-y="${esc(s.id)}" title="${esc(s.code + ' · ' + course(s.code).title)}">${two ? subj + '<br>' + num : num}</button>`;
    }).join('');
    return `<div class="g-col ${d === o.sel ? 'on' : ''}">${blocks}</div>`;
  }).join('');
  return `<div class="grid">${head}<div class="g-body" style="height:${H}px"><div class="g-lab">${labels}</div>${cols}</div></div>`;
}

/* ---- Explore ---------------------------------------------------------------------------------- */
function qMatch(hay, q) { return hay.toLowerCase().includes(q) || hay.replace(/\s/g, '').toLowerCase().includes(q.replace(/\s/g, '')); }
function passClass(code) {
  const c = course(code), q = S.q.trim().toLowerCase();
  if (S.savedOnly && !isSaved('c:' + code)) return false;
  if (S.subj !== 'All' && code.split(' ')[0] !== S.subj) return false;
  if (S.openOnly && !courseSeats(code).anyOpen) return false;
  if (q && !(qMatch(code, q) || c.title.toLowerCase().includes(q) || courseProfs(code).some(p => p && profName(p).toLowerCase().includes(q)))) return false;
  return true;
}
function passProf(pk) {
  const p = PROFS[pk], q = S.q.trim().toLowerCase();
  if (!p.teaches) return false;
  if (S.savedOnly && !isSaved('p:' + pk)) return false;
  if (S.subj !== 'All' && !profCourses(pk).some(c => c.split(' ')[0] === S.subj)) return false;
  if (q && !(p.name.toLowerCase().includes(q) || (p.dept || '').toLowerCase().includes(q) || profCourses(pk).some(c => qMatch(c, q)))) return false;
  return true;
}
function classCard(code) {
  const c = course(code), ss = secsOf(code), ps = courseProfs(code).filter(Boolean), fr = friendsIn(code);
  return `<button class="card ccard" data-a="openClass" data-x="${code}">
  <div class="row sb"><span class="code">${code}</span>${courseBadge(code)}</div>
  <div class="ctitle">${esc(c.title)}</div>
  <div class="row sb"><span class="muted b" style="font-size:14.5px">${ss.length} section${ss.length === 1 ? '' : 's'}${ps.length ? ` · ${ps.length} professor${ps.length === 1 ? '' : 's'}` : ''}</span><span class="row" style="gap:6px">${avStack(fr, 24)}<span class="chev">${ic('chevR', 18)}</span></span></div></button>`;
}
function profCard(pk) {
  const p = PROFS[pk], r = ratingOf(pk), st = reviewStats(pk), took = (TC.took && TC.took[pk] || []).map(t => t.uid).filter((u, i, a) => a.indexOf(u) === i && TC.friends.includes(u));
  const line = [p.count ? `${p.count} PolyRatings evaluation${p.count === 1 ? '' : 's'}` : (r == null ? 'Not on PolyRatings' : ''), st && st.again != null ? `${st.again}% would take again` : ''].filter(Boolean).join(' · ');
  return `<button class="card pcard" data-a="openProf" data-x="${esc(pk)}">
  <div class="row">${profAv(pk, 44, 15)}<div class="grow"><div style="font-weight:900;font-size:17px">${esc(p.name)}</div>${p.dept ? `<div class="muted b" style="font-size:13.5px">${esc(p.dept)}</div>` : ''}</div>${r != null ? `<span class="rchip">${starI(13)} ${r.toFixed(1)}</span>` : ''}</div>
  ${line ? `<div class="muted b" style="font-size:13.5px;margin:10px 0">${line}</div>` : '<div style="height:10px"></div>'}
  <div class="row sb"><span class="row" style="gap:6px;flex-wrap:wrap">${profCourses(pk).slice(0, 4).map(c => `<span class="code" style="font-size:12px;padding:4px 8px">${c}</span>`).join('')}</span>${took.length ? `<span class="row" style="gap:6px">${avStack(took, 22)}<span class="muted b" style="font-size:13px">${took.length} took</span></span>` : ''}</div></button>`;
}
function exploreRows() {
  if (S.exMode === 'classes') {
    const fc = c => friendsIn(c).length;
    const l = Object.keys(COURSES).filter(passClass);
    const q = S.q.trim().toLowerCase().replace(/\s/g, '');
    return l.sort((a, b) => (q ? (b.replace(' ', '').toLowerCase().startsWith(q) - a.replace(' ', '').toLowerCase().startsWith(q)) : 0) || fc(b) - fc(a) || a.localeCompare(b, undefined, { numeric: true }));
  }
  return Object.keys(PROFS).filter(passProf).sort((a, b) => ((ratingOf(b) ?? -1) - (ratingOf(a) ?? -1)) || (PROFS[b].count - PROFS[a].count));
}
function exploreList() {
  if (!TC.seatsLoaded) return TC.err.seats ? errCard(`Couldn’t load ${CFG.TERM_LABEL} classes.`, 'retrySeats') : loadingCard(`Loading ${CFG.TERM_LABEL} classes…`);
  const rows = exploreRows();
  if (!rows.length) return emptyEx();
  const shown = rows.slice(0, S.exLimit);

    (rows.length > shown.length ? `<button class="btn soft" style="margin:4px 0 8px" data-a="more">Show more (${rows.length - shown.length} left)</button>` : '') +
    (S.exMode === 'profs' && TC.err.poly ? `<div class="muted b" style="font-size:12.5px;text-align:center;padding:6px 0">PolyRatings didn’t load, so ratings are missing.</div>` : '');
}

/* ---- Friends & chats -------------------------------------------------------------------------- */
function threadName(t) {
  if (t.kind === 'direct') { const o = threadOther(t); return o ? nameOf(o) : 'Chat'; }
  if (t.title) return t.title;
  return t.members.filter(u => u !== TC.user.id).map(u => nameOf(u).split(' ')[0]).slice(0, 3).join(', ') || 'Group';
}
function msgText(m) {
  if (!m) return '';
  if (m.body) return m.body;
  if (m.kind && m.kind !== 'text') return 'Shared ' + String(m.kind).replace(/_/g, ' ');
  return '';
}
function threadRow(t) {
  const last = t.last, unread = isUnread(t);
  let avh;
  if (t.kind === 'direct') { const o = threadOther(t); if (o && !PEOPLE[o]) PEOPLE[o] = Object.assign(personFrom({ id: o, display_name: nameOf(o), avatar_url: (TC.names[o] || {}).avatar }), {}); avh = `<span class="ringav" style="--rc:${o && TC.friends.includes(o) ? status(o).c || 'transparent' : 'transparent'}">${o ? pav(o, 48, 16) : av('?', '#E6EAF1', 48, 16)}</span>`; }
  else { const nm = threadName(t); avh = `<span class="ringav"><span class="sq" style="width:48px;height:48px;background:${t.kind === 'class' ? '#D6E4FF' : colorFor(t.id)};color:${t.kind === 'class' ? 'var(--blue-ink)' : 'var(--ink2)'};font-size:${t.kind === 'class' ? 13 : 16}px">${esc(t.kind === 'class' ? (nm.split(' ')[1] || nm).slice(0, 5) : initialsOf(nm))}</span></span>`; }
  const who = last ? (last.sender === TC.user.id ? 'You: ' : (t.kind !== 'direct' ? nameOf(last.sender).split(' ')[0] + ': ' : '')) : '';
  return `<button class="thread" data-a="openChat" data-x="${t.id}">${avh}<div class="grow"><div class="nm">${esc(threadName(t))}</div><div class="pv ${unread ? '' : 'read'}">${esc(last ? who + msgText(last) : 'No messages yet')}</div></div><div class="tm">${last ? agoText(last.created_at) : ''}${unread ? '<span class="udot"></span>' : '<span style="height:10px"></span>'}</div></button>`;
}
function friendsList() {
  const q = S.fq.trim().toLowerCase(), F = S.friendsFilter;
  if (F === 'requests') {
    return TC.requests.length ? `<div class="card list" style="margin:0 16px">${TC.requests.map(id => `<div class="li">${pav(id, 46, 16)}<div class="grow"><div style="font-weight:900;font-size:16px">${esc(PEOPLE[id].name)}</div><div class="muted b" style="font-size:13.5px">${PEOPLE[id].handle ? '@' + esc(PEOPLE[id].handle) : 'Wants to be friends'}</div></div><button class="pbtn pink" data-a="acceptReq" data-x="${id}">Accept</button><button class="xbtn" data-a="declineReq" data-x="${id}" aria-label="Decline">${ic('x', 16, 2.4)}</button></div>`).join('')}</div>` : `<div class="empty"><b>No requests</b>You’re all caught up.</div>`;
  }
  if (F === 'people') {
    const l = TC.friends.filter(id => !q || PEOPLE[id].name.toLowerCase().includes(q) || (PEOPLE[id].handle || '').toLowerCase().includes(q));
    return l.length ? `<div class="card list" style="margin:0 16px">${l.map(id => { const st = status(id); return `<button class="li" data-a="openFriend" data-x="${id}">${pav(id, 46, 16)}<div class="grow"><div style="font-weight:900;font-size:16px">${esc(PEOPLE[id].name)}</div><div class="b" style="font-size:13px;color:${st.c || 'var(--muted)'}">${st.free === null ? esc(st.t) : '● ' + esc(st.t)}</div></div><span class="chev">${ic('chevR', 18)}</span></button>`; }).join('')}</div>` : `<div class="empty"><b>${TC.friends.length ? 'No one by that name' : 'No friends yet'}</b>${TC.friends.length ? '' : 'Tap + to find classmates.'}</div>`;
  }
  if (TC.err.threads && !TC.threads.length) return errCard('Couldn’t load your chats.', 'refresh');
  let ts = TC.threads.filter(t => F === 'all' || (F === 'groups' && t.kind === 'group') || (F === 'class' && t.kind === 'class'));
  if (q) ts = ts.filter(t => threadName(t).toLowerCase().includes(q) || (t.last && msgText(t.last).toLowerCase().includes(q)));
  if (!TC.ready && !ts.length) return loadingCard('Loading chats…');
  return ts.length ? `<div class="card" style="margin:0 16px;padding:2px 0">${ts.map(threadRow).join('')}</div>` : `<div class="empty"><b>${q ? 'No chats found' : 'No chats yet'}</b>${q ? 'Try a different name.' : TC.friends.length ? 'Open a friend and tap Message.' : ''}</div>`;
}
SCREENS.friends = () => {

/* ================= Champ = Hawk =================
   Champ asks the same `ask` function the desktop's Hawk uses. The model never writes an answer:
   it names ONE tool, and the code below answers that tool from the data this app loaded. So
   every class, seat, time and rating Champ says is one the student could find on the screens.
   When the model can't be reached (signed out, the daily budget, offline), Champ answers the
   simple questions itself from the same data, and says so for the rest. */
const HDAY = { Mo: 'M', Tu: 'T', We: 'W', Th: 'R', Fr: 'F', Sa: 'S', Su: 'U' };
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; };
function findProfKey(name) {
  if (!name) return null;
  const k = profKeyOf(name); if (k && PROFS[k]) return k;
  const q = String(name).toLowerCase().replace(/^(prof(essor)?|dr)\.?\s+/, '').trim();
  const hits = Object.keys(PROFS).filter(pk => { const n = PROFS[pk].name.toLowerCase(); return n === q || n.split(' ').pop() === q || n.startsWith(q + ' '); });
  return hits.length === 1 ? hits[0] : (hits.find(pk => PROFS[pk].teaches) || hits[0] || null);
}
function findFriend(name) {
  const q = String(name || '').toLowerCase().trim(); if (!q) return null;
  const all = TC.friends.filter(id => { const p = PEOPLE[id]; return p.name.toLowerCase() === q || p.name.toLowerCase().split(' ')[0] === q || (p.handle || '').toLowerCase() === q.replace(/^@/, ''); });
  return all.length === 1 ? all[0] : null;
}
const cc = c => canonCode(c);
const pl = pk => pk ? `<b>${esc(profName(pk))}</b> (${ratingOf(pk) != null ? `★${ratingOf(pk).toFixed(1)} from ${PROFS[pk].count} PolyRatings` : 'not on PolyRatings'})` : '<b>Instructor not assigned</b>';
const secLine = s => `<b>${s.code}${s.sec ? ' §' + esc(s.sec) : ''}</b> ${secWhen(s)} · ${esc(profName(s.prof))}${ratingOf(s.prof) != null ? ' ★' + ratingOf(s.prof).toFixed(1) : ''} · ${secSeatText(s)}`;
function conflicts(planIds, sec) { return planIds.map(i => SEC[i]).filter(Boolean).filter(s => !s.async && !sec.async && s.s != null && sec.s != null && s.code !== sec.code && [...s.days].some(d => sec.days.includes(d)) && s.s < sec.e && sec.s < s.e); }
function clashWithMine(sec) { return personSecs('me').filter(s => s.s != null && sec.s != null && !sec.async && s.code !== sec.code && [...s.days].some(d => sec.days.includes(d)) && s.s < sec.e && sec.s < s.e); }

function ansClass(code) {
  if (!COURSES[code]) return { t: TC.seatsLoaded ? `${code} isn’t offered in ${esc(CFG.TERM_LABEL)}.` : 'Classes are still loading — ask again in a moment.' };
  const c = course(code), cs = courseSeats(code), fr = friendsIn(code);
  const t = `<b>${code} · ${esc(c.title)}</b><br>${courseProfs(code).map(p => '• ' + pl(p)).join('<br>')}<br><br>${cs.anyOpen ? (cs.open ? cs.open + ' open seats' : 'Has open sections') : cs.allFull ? 'Every section is full' : 'Seat counts aren’t posted'}${fr.length ? ` · ${fr.map(f => esc(PEOPLE[f].short)).join(', ')} ${fr.length > 1 ? 'are' : 'is'} in it` : ''}.`;
  return { t, acts: [['Open ' + code, 'openClass', code]] };
}
function ansProf(pk) {
  if (!pk) return { t: 'I couldn’t find that professor.' };
  const st = reviewStats(pk), cs = profCourses(pk);
  let t = pl(pk);
  t += cs.length ? ` teaches ${cs.join(', ')} in ${esc(CFG.TERM_LABEL)}.` : ` isn’t teaching in ${esc(CFG.TERM_LABEL)}.`;
  if (st) t += `<br>TermChamp reviews (${st.n}): ${st.again != null ? st.again + '% would take again' : ''}${st.again != null && st.diff != null ? ', ' : ''}${st.diff != null ? 'difficulty ' + st.diff + '/5' : ''}.`;
  return { t, acts: [['View ' + profName(pk).split(' ')[0], 'openProf', pk]] };
}
function ansBest(code) {
  if (!COURSES[code]) return ansClass(code);
  const ps = courseProfs(code).filter(Boolean);
  const rated = ps.filter(p => ratingOf(p) != null).sort((a, b) => ratingOf(b) - ratingOf(a));

  rateProf: (pid, code) => {
    if (!PROFS[pid]) return;
    if (iReviewed(pid)) { toast('You’ve already reviewed ' + profName(pid)); return; }
    const item = TC.rateList.flatMap(t => t.items.map(i => [...i, t.term])).find(i => i[0] === pid && (!code || i[1] === code));
    /* The classes this student actually took with them — this term's and past ones. Only when we
       know of none is the list what they teach, and then the student picks. */
    const taken = [...new Set(personSecs('me').filter(s => s.prof === pid).map(s => s.code).concat((TC.myHistory || []).filter(h => profKeyOf(h.professor) === pid).map(h => canonCode(h.code)).filter(Boolean)))];
    const codes = taken.length ? taken : profCourses(pid);
    code = (codes.length === 1 ? codes[0] : null) || (code && codes.includes(code) ? code : null);
    S.draft = { prof: pid, code, codes, term: item ? item[2] : '', stars: 0, diff: 0, again: null, more: false, grade: null, format: null, review: '', err: '' };
    UI.champ = false; UI.sheet = null; go('rateForm');
  },
  draft: (k, v) => { const d = S.draft; const val = (k === 'stars' || k === 'diff') ? +v : v; d[k] = d[k] === val && k !== 'stars' && k !== 'code' ? null : val; if (k === 'diff' && d.diff === null) d.diff = 0; d.err = ''; render(true); },
  draftMore: () => { S.draft.more = !S.draft.more; render(true); },
  postRating: async () => {
    const d = S.draft; if (!d || !d.stars || !d.code || UI.busy.rate) return;
    UI.busy.rate = 1; render(true);
    const r = await TC.postReview(d.prof, d);
    UI.busy.rate = 0;
    if (r.err) { d.err = r.err; render(true); return; }
    S.lastRated = Object.assign({}, d, { reviewId: r.id, share: false });
    const st = S.stack[S.tab]; st[st.length - 1] = { s: 'rateThanks', p: {} }; render();
  },
  toggleShow: async () => { const d = S.lastRated; if (!d || !d.reviewId) return; const next = !d.share; if (await TC.setShare(d.reviewId, next)) { d.share = next; } else toast('Couldn’t change that — try again'); render(true); },
  rateDone: () => { const st = S.stack[S.tab]; st.pop(); if (!st.length) st.push({ s: S.tab }); render(); },
  rateAnother: () => { const u = unrated(); const st = S.stack[S.tab]; st.pop(); if (!st.length) st.push({ s: S.tab }); if (u.length) A.rateProf(u[0][0], u[0][1]); else render(); },
  fFilter: f => { S.friendsFilter = f; render(true); },
  fFilterGo: f => { UI.champ = false; S.friendsFilter = f; setTab('friends'); },
  openChat: id => { UI.champ = false; TC.openThread(id); go('chat', { id }); },
  retryChat: () => { const e = cur(); if (e.p && e.p.id) TC.openThread(e.p.id); },
  openChatTab: id => { UI.sheet = null; S.tab = 'friends'; S.stack.friends = [{ s: 'friends' }]; A.openChat(id); },
  openChatWith: async pid => { UI.champ = false; const id = await TC.threadWith(pid); if (id) A.openChat(id); },
  draftTo: async (pid, text) => { UI.champ = false; const id = await TC.threadWith(pid); if (!id) return; UI.prefill = { id, text: text || '' }; A.openChat(id); },
  addFriend: async id => {
    if (UI.busy['f' + id]) return; UI.busy['f' + id] = 1;
    if (TC.relation(id) === 'sent') { if (await TC.cancelRequest(id)) toast('Request canceled'); }
    else if (await TC.sendRequest(id)) toast(`Request sent to ${PEOPLE[id].short}`);
    UI.busy['f' + id] = 0; render(true);
  },
  acceptReq: async id => { if (await TC.acceptRequest(id)) { toast(`You and ${PEOPLE[id].short} are now friends`); relinkPeople(); } render(true); },
  declineReq: async id => { if (await TC.declineRequest(id)) toast('Request declined'); render(true); },
  copyInvite: async () => {
    const url = WEB + '/' + (PEOPLE.me.handle ? '?invite=' + encodeURIComponent(PEOPLE.me.handle) : '');
    try { if (navigator.share) { await navigator.share({ title: 'TermChamp', text: 'See who’s in your classes on TermChamp', url }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(url); toast('Invite link copied'); } catch (e) { toast(url); }
  },
  openChamp: () => { UI.champ = true; UI.sheet = null; render(true); champEnd(); },
  ask: q => ask(q),
  champClear: () => { S.champMsgs = []; render(true); },
  champAdd: id => { const ok = addSec(id); if (ok) { S.champMsgs.push({ t: `Done. ${SEC[id].code} is in Plan ${S.plan}.`, acts: [['Open Plans', 'schedTabGo', 'plans']] }); render(true); champEnd(); } }
};
async function runPeople(q) {
  UI.peopleQ = q; if (String(q).trim().length < 2) { UI.peopleRes = null; render(true); return; }
  UI.peopleRes = 'busy'; render(true);
  try { const r = await TC.searchPeople(q); if (UI.peopleQ === q) UI.peopleRes = r; }
  catch (e) { UI.peopleRes = { err: 'Couldn’t search right now — try again.' }; }
  render(true);
}
const SUBMIT = {
  send: async form => {
    const inp = form.querySelector('input'), v = inp.value.trim(); if (!v || UI.busy.send) return;
    const id = form.dataset.x; UI.busy.send = 1; inp.value = ''; UI.prefill = null;
    const ok = await TC.send(id, v); UI.busy.send = 0;
    if (!ok) inp.value = v;
    render(true); scrollEnd();
  },
  champ: form => { const inp = form.querySelector('input'); const v = inp.value; inp.value = ''; ask(v); },
  people: form => runPeople(form.querySelector('input').value),
  pw: async form => {
    const e = form.querySelector('#si-email').value.trim(), p = form.querySelector('#si-pw').value;
    UI.signin.email = e; UI.busy.signin = 1; UI.signin.err = ''; render();
    const err = await TC.signInPassword(e, p); UI.busy.signin = 0;
    if (err) { UI.signin.err = /invalid/i.test(err) ? 'That email and password don’t match. If you signed up with Google, use Continue with Google.' : err; render(); }
  },
  sendCode: async form => {
    const e = form.querySelector('#si-email').value.trim(); UI.signin.email = e; UI.busy.signin = 1; UI.signin.err = ''; render();
    const err = await TC.sendCode(e); UI.busy.signin = 0;
    if (err) { UI.signin.err = /signups? not allowed|not found|user/i.test(err) ? 'No TermChamp account uses that email. Create one on termchamp.com first.' : err; render(); return; }
    UI.signin.mode = 'verify'; render();
  },
  verify: async form => {
    const c = form.querySelector('#si-code').value.trim(); UI.busy.signin = 1; UI.signin.err = ''; render();
    const err = await TC.verifyCode(UI.signin.email, c); UI.busy.signin = 0;
    if (err) { UI.signin.err = /expired|invalid/i.test(err) ? 'That code didn’t work or has expired. Send a new one.' : err; render(); }
  }
};
function scrollEnd() { const sc = document.getElementById('scroll'); sc.scrollTop = sc.scrollHeight; }

/* ================= render ================= */
const TABS = [['home', 'Home', 'home', '#1D4ED8', '#E3ECFF'], ['explore', 'Explore', 'search', '#7C3AED', '#EFE7FF'], ['rate', 'Rate', 'star', '#D97706', '#FEF1DC'], ['schedule', 'Schedule', 'cal', '#0F766E', '#DDF5F1'], ['friends', 'Friends', 'users', '#DB2777', '#FCE4F0']];
function render(keep) {
  const sc = document.getElementById('scroll'); if (!sc) return;
  const ae = document.activeElement, focusId = ae && ae.id && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') ? ae.id : null, sel = focusId ? [ae.selectionStart, ae.selectionEnd, ae.value] : null;
  const y = sc.scrollTop, champY = (document.getElementById('champscroll') || {}).scrollTop;
  const sh = document.getElementById('sheet');
  if (TC.phase !== 'ok') {
    sc.innerHTML = signinView(); sc.style.paddingTop = ''; sc.style.background = '';
    ['fixtop', 'fixbot', 'chrome'].forEach(i => { document.getElementById(i).innerHTML = ''; });
    sh.innerHTML = ''; document.getElementById('status').classList.remove('dark');
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (el.value === sel[2]) try { el.setSelectionRange(sel[0], sel[1]); } catch (_) {} } }
    return;
  }
  const e = cur(); let v;
  try { v = SCREENS[e.s](e.p || {}); } catch (err) { console.error('[termchamp app]', err); v = missingScreen('Something went wrong on this screen.'); }
  sc.innerHTML = v.body;
  sc.style.paddingTop = v.padTop ? `calc(var(--sb) + ${v.padTop}px)` : '';
  document.getElementById('fixtop').innerHTML = v.top || '';
  document.getElementById('fixbot').innerHTML = v.bot || '';
  document.getElementById('status').classList.toggle('dark', !!v.dark);
  sc.style.background = v.dark ? 'linear-gradient(#0F172A 0 50%,var(--bg) 50%)' : '';
  const onTab = S.tab;
  const badge = k => k === 'friends' && (TC.requests.length + TC.threads.filter(isUnread).length) ? '<span class="dot" style="position:absolute;top:6px;right:calc(50% - 22px)"></span>' : '';
  document.getElementById('chrome').innerHTML = (v.tabbar ? `<nav class="tabbar">${TABS.map(([k, l, i, ac, acs]) => `<button class="tab ${onTab === k ? 'on' : ''}" style="--ac:${ac};--acs:${acs};position:relative" data-a="tab" data-x="${k}"><span class="pill">${ic(i, 23, 2.1, onTab === k && k === 'rate' ? 'currentColor' : 'none')}</span>${l}${badge(k)}</button>`).join('')}</nav>` : '') +
    (v.fab && !UI.champ ? `<button class="fab" data-a="openChamp" aria-label="Ask Champ"><span class="bub">Ask Me!</span><img src="${CHAMP}" alt=""></button>` : '');
  if (UI.champ) sh.innerHTML = `<div class="scrim" data-a="closeSheet"></div><div class="sheet champ" style="${S.champMsgs.length ? 'height:calc(100% - var(--sb) - 16px)' : ''}">${champView()}</div>`;
  else if (UI.sheet) sh.innerHTML = `<div class="scrim" data-a="closeSheet"></div><div class="sheet"><div class="grab"></div><div class="sbody">${SHEETS[UI.sheet.type](UI.sheet)}</div></div>`;
  else sh.innerHTML = '';
  if (keep) sc.scrollTop = y; else sc.scrollTop = e.y || 0;
  if (v.scrollEnd && !keep) scrollEnd();
  const cs = document.getElementById('champscroll'); if (cs && champY != null) cs.scrollTop = champY;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (el.value === sel[2]) try { el.setSelectionRange(sel[0], sel[1]); } catch (_) {} } }
}
let toastT;
function toast(m) { const t = document.getElementById('toast'); if (!t) return; t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

/* ================= events ================= */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (!f) return; ev.preventDefault();
  f(el.dataset.x, el.dataset.y, el);
});
document.addEventListener('submit', ev => { const f = ev.target.closest('[data-submit]'); if (!f) return; ev.preventDefault(); const h = SUBMIT[f.dataset.submit]; if (h) h(f); });
let qT;
document.addEventListener('input', ev => {
  const k = ev.target.dataset.in; if (!k) return;
  if (k === 'q') { S.q = ev.target.value; S.exLimit = 40; clearTimeout(qT); qT = setTimeout(() => { const el = document.getElementById('exlist'); if (el) el.innerHTML = exploreList(); }, 120); }
  else if (k === 'fq') { S.fq = ev.target.value; document.getElementById('flist').innerHTML = friendsList(); }
  else if (k === 'review') { S.draft.review = ev.target.value; const n = wordCount(ev.target.value), c = document.getElementById('revcount'); if (c) { c.textContent = n + '/300 words'; c.style.color = n > 300 ? '#B91C1C' : ''; } }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (UI.sheet || UI.champ)) A.closeSheet(); });
function fit() { const s = Math.min(1, (innerHeight - 32) / 874, (innerWidth - 32) / 402); document.documentElement.style.setProperty('--s', s); }
addEventListener('resize', fit); fit();
/* The phone frame's status bar shows the real time (on a real phone it is hidden). */
function tickClock() { const el = document.querySelector('#status > span'); if (el) { const d = new Date(); el.textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0'); } }
tickClock(); setInterval(() => { tickClock(); if (TC.phase === 'ok' && !document.activeElement.matches('input,textarea') && !UI.champ) render(true); }, 60000);
/* Coming back to the app after a while: pick up new messages, requests and seats. */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TC.ready && Date.now() - (TC.loadedAt || 0) > 120000) { TC.loadedAt = Date.now(); TC.refresh(); loadSeats(); } });
render();
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => TC.boot()); else TC.boot();


</script>
